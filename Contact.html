<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Contact Me</h1>
    <fieldset>
        <legend>Contact Form</legend>
        <form action="mailto:sharmahappy132103@gmail.com" method="post" enctype="text/plain">
                    <fieldset>
                        <legend><b>Personal Information</b></legend>
                        <table >
                                <tr>
                                    <th scope="row">
                                        <label for="first-name">First Name</label>
                                    </th>
                                    <td>
                                        <input
                                            type="text"
                                            id="first-name"
                                            name="first_name"
                                            required
                                            autocomplete="given-name"
                                        >
                                    </td>
                                </tr>

                                <tr>
                                    <th scope="row">
                                        <label for="last-name">Last Name</label>
                                    </th>
                                    <td>
                                        <input
                                            type="text"
                                            id="last-name"
                                            name="last_name"
                                            required
                                            autocomplete="family-name"
                                        >
                                    </td>
                                </tr>

                                <tr>
                                    <th scope="row">
                                        <label for="email">Email</label>
                                    </th>
                                    <td>
                                        <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            required
                                            autocomplete="email"
                                        >
                                    </td>
                                </tr>

                                <tr>
                                    <th scope="row">
                                        <label for="phone">Phone</label>
                                    </th>
                                    <td>
                                        <input
                                            type="tel"
                                            id="phone"
                                            name="phone"
                                            autocomplete="tel"
                                        >
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">
                                        <label for="gender">Gender</label>
                                    </th>
                                    <td>
                                        <label for="gender">Male</label>
                                        <input type="radio" id="male" name="gender" value="male">
                                        <label for="gender">Female</label>
                                        <input type="radio" id="female" name="gender" value="female">
                                    </td>
                                </tr>
                        </table>
                    </fieldset>
            <p align="center">
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </p>
        </form>
    </fieldset>
    <p align="center">
        <a href="AcademicDetails.html">Academic Details</a> | 
        <a href="Project.html">Project Details</a> | 
        <a href="fullSite.html">Full Profile in One Page</a> | 
        <a href="index.html">Personal Details</a>
    </p>
</body>
</html>
